services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: test_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test"]
      interval: 5s
      retries: 5

  app:
    build: .
    command: pytest -v
    env_file:
      - .env.test
    depends_on:
      db:
        condition: service_healthy
